<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LITchess</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 290px;
      background: #262421;
      color: #e8e6e3;
      font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    .wrap { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
    header { display: flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 700; }
    header img { width: 24px; height: 24px; border-radius: 6px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    hr { border: 0; border-top: 1px solid #3d3a37; margin: 0; }
    button.primary {
      flex: 1;
      height: 36px;
      border: 0;
      border-radius: 8px;
      background: #629924;
      color: #fff;
      font: 600 14px inherit;
      font-family: inherit;
      cursor: pointer;
    }
    button.primary:hover { background: #6fae29; }
    .label { display: flex; flex-direction: column; gap: 2px; }
    .hint { margin: 0; font-size: 12px; color: #9a9894; }
    .label small { color: #9a9894; font-size: 12px; }

    /* on/off switch */
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .slider {
      position: absolute; inset: 0;
      background: #55524e;
      border-radius: 24px;
      cursor: pointer;
      transition: background .15s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 18px; height: 18px;
      left: 3px; top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform .15s;
    }
    .switch input:checked + .slider { background: #629924; }
    .switch input:checked + .slider::before { transform: translateX(20px); }
    .switch input:focus-visible + .slider { outline: 2px solid #3893e8; outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="icon-48.png" alt="">
      <span>LITchess</span>
    </header>

    <div class="row">
      <button class="primary" id="setBoard">Set Lichess board</button>
      <label class="switch" title="Lichess board and pieces on chess.com">
        <input type="checkbox" id="themeToggle">
        <span class="slider"></span>
      </label>
    </div>

    <hr>

    <div class="row">
      <div class="label">
        <span>Lichess analysis</span>
        <small>"Analyze on Lichess" button after a game</small>
      </div>
      <label class="switch" title="Show the Analyze on Lichess button">
        <input type="checkbox" id="analysisToggle">
        <span class="slider"></span>
      </label>
    </div>

    <hr>

    <div class="row">
      <div class="label">
        <span>Hide ads &amp; promos</span>
        <small>Banners and "Upgrade" buttons</small>
      </div>
      <label class="switch" title="Hide ads and Upgrade buttons on chess.com">
        <input type="checkbox" id="hideToggle">
        <span class="slider"></span>
      </label>
    </div>

    <p class="hint">Reload chess.com to apply changes.</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
