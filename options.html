<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LITchess</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #393834;
      color: #e8e6e3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 28px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    h1 { margin: 0; font-size: 22px; }
    .controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; justify-content: center; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 13px; color: #b9b7b3; }
    select, button { font-size: 14px; height: 34px; border-radius: 6px; border: 0; }
    select { width: 170px; padding: 0 8px; background: #fff; color: #111; }
    #save { width: 110px; background: #629924; color: #fff; font-weight: 600; cursor: pointer; }
    #save:hover { background: #6fae29; }
    #status { height: 18px; font-size: 14px; color: #8fd14f; opacity: 0; transition: opacity .2s; }
    #status.show { opacity: 1; }

    #board {
      width: min(560px, 90vw);
      aspect-ratio: 1 / 1;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      border-radius: 4px;
      overflow: hidden;
      background-size: 100% 100%;
      background-repeat: no-repeat;
    }
    #board.plain {
      background: repeating-conic-gradient(#b58863 0% 25%, #f0d9b5 0% 50%) 0 0 / 25% 25%;
    }
    .sq {
      background-size: 90%;
      background-position: center;
      background-repeat: no-repeat;
    }
    .hide-section { width: min(560px, 90vw); display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .hide-section h2 { margin: 0; font-size: 16px; }
    .hide-section p { margin: 0; font-size: 13px; color: #9a9894; }
    textarea {
      width: 100%; height: 110px; padding: 8px; border-radius: 6px;
      border: 1px solid #55524e; background: #262421; color: #e8e6e3;
      font: 13px ui-monospace, Menlo, monospace; resize: vertical;
    }
    #saveHide { width: 110px; background: #629924; color: #fff; font-weight: 600; cursor: pointer; }
    #saveHide:hover { background: #6fae29; }
    #hideStatus { font-size: 14px; color: #8fd14f; opacity: 0; transition: opacity .2s; }
    #hideStatus.show { opacity: 1; }
    #note { margin: 0; font-size: 13px; color: #9a9894; min-height: 18px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>LITchess</h1>

    <div class="controls">
      <div class="field">
        <label for="pieceTheme">Piece theme</label>
        <select id="pieceTheme">
          <option value="none">None</option>
          <option value="cburnett">Burnett</option>
          <option value="merida">Merida</option>
          <option value="alpha">Alpha</option>
          <option value="pirouetti">Pirouetti</option>
          <option value="chessnut">Chessnut</option>
          <option value="chess7">Chess 7</option>
          <option value="reillycraig">Reilly Craig</option>
          <option value="companion">Companion</option>
          <option value="riohacha">Riohacha</option>
          <option value="kosal">Kosal</option>
          <option value="leipzig">Leipzig</option>
          <option value="fantasy">Fantasy</option>
          <option value="spatial">Spatial</option>
          <option value="celtic">Celtic</option>
          <option value="california">California</option>
          <option value="pixel">Pixel</option>
          <option value="maestro">Maestro</option>
          <option value="fresca">Fresca</option>
          <option value="cardinal">Cardinal</option>
          <option value="gioco">Gioco</option>
          <option value="tatiana">Tatiana</option>
          <option value="staunty">Staunty</option>
          <option value="governor">Governor</option>
          <option value="dubrovny">Dubrovny</option>
          <option value="icpieces">IC pieces</option>
          <option value="mpchess">MP chess</option>
          <option value="kiwen-suwi">Kiwen Suwi</option>
          <option value="horsey">Horsey</option>
          <option value="anarcandy">Anarcandy</option>
          <option value="shapes">Shapes</option>
          <option value="letter">Letter</option>
          <option value="disguised">Disguised</option>
        </select>
      </div>

      <div class="field">
        <label for="boardTheme">Board theme</label>
        <select id="boardTheme">
          <option value="none">None</option>
          <option value="blue">Blue</option>
          <option value="ncf-board">NCF</option>
          <option value="blue2">Blue 2</option>
          <option value="blue3">Blue 3</option>
          <option value="blue-marble">Blue marble</option>
          <option value="canvas2">Canvas</option>
          <option value="wood">Wood</option>
          <option value="wood2">Wood 2</option>
          <option value="wood3">Wood 3</option>
          <option value="wood4">Wood 4</option>
          <option value="maple">Maple</option>
          <option value="maple2">Maple 2</option>
          <option value="brown">Brown</option>
          <option value="leather">Leather</option>
          <option value="green">Green</option>
          <option value="marble">Marble</option>
          <option value="green-plastic">Green plastic</option>
          <option value="grey">Grey</option>
          <option value="metal">Metal</option>
          <option value="olive">Olive</option>
          <option value="newspaper">Newspaper</option>
          <option value="purple">Purple</option>
          <option value="purple-diag">Purple diag</option>
          <option value="pink-pyramid">Pink</option>
          <option value="ic">IC</option>
          <option value="horsey">Horsey</option>
        </select>
      </div>

      <button id="save">Save</button>
    </div>

    <div id="status">Saved. Reload chess.com to apply.</div>

    <div id="board" class="plain"></div>
    <p id="note"></p>

    <div class="hide-section">
      <h2>Hide extra elements</h2>
      <p>Something on chess.com still bothers you? Right-click it, choose Inspect Element, and add its class or id here, one per line, for example <code>.some-banner</code> or <code>#some-id</code>.</p>
      <textarea id="hideSelectors" spellcheck="false" placeholder=".some-banner&#10;#some-id"></textarea>
      <div>
        <button id="saveHide">Save</button>
        <span id="hideStatus">Saved. Reload chess.com to apply.</span>
      </div>
    </div>
  </main>
  <script src="options.js"></script>
</body>
</html>
