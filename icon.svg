<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34322e"/>
      <stop offset="1" stop-color="#1f1e1b"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="120" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9a1f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff4d00"/>
      <stop offset="0.55" stop-color="#ff9a1f"/>
      <stop offset="1" stop-color="#ffe066"/>
    </linearGradient>
    <linearGradient id="pawn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9d9b8"/>
      <stop offset="0.45" stop-color="#fbf3df"/>
      <stop offset="1" stop-color="#d2bf98"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>

    <!-- checkerboard edge at the bottom -->
    <g>
      <rect x="0"   y="448" width="64" height="64" fill="#b58863"/>
      <rect x="64"  y="448" width="64" height="64" fill="#f0d9b5"/>
      <rect x="128" y="448" width="64" height="64" fill="#b58863"/>
      <rect x="192" y="448" width="64" height="64" fill="#f0d9b5"/>
      <rect x="256" y="448" width="64" height="64" fill="#b58863"/>
      <rect x="320" y="448" width="64" height="64" fill="#f0d9b5"/>
      <rect x="384" y="448" width="64" height="64" fill="#b58863"/>
      <rect x="448" y="448" width="64" height="64" fill="#f0d9b5"/>
    </g>

    <!-- pawn (a candle) -->
    <g>
      <ellipse cx="256" cy="446" rx="150" ry="14" fill="#000" opacity="0.28"/>
      <rect x="116" y="404" width="280" height="44" rx="20" fill="url(#pawn)"/>
      <rect x="150" y="370" width="212" height="46" rx="20" fill="url(#pawn)"/>
      <path d="M206 232 H306 C312 292 340 332 356 374 H156 C172 332 200 292 206 232 Z" fill="url(#pawn)"/>
      <rect x="170" y="206" width="172" height="40" rx="20" fill="url(#pawn)"/>
      <circle cx="256" cy="156" r="62" fill="url(#pawn)"/>
    </g>

    <!-- flame on top -->
    <path d="M256 20 C270 56 316 78 316 118 C316 148 290 164 256 164 C222 164 196 148 196 118 C196 94 214 78 226 60 C232 82 246 88 250 84 C262 70 252 46 256 20 Z" fill="url(#flame)"/>
    <path d="M256 86 C264 104 288 114 288 134 C288 150 274 160 256 160 C238 160 224 150 224 134 C224 120 236 112 242 100 C246 110 252 108 254 104 C258 98 254 94 256 86 Z" fill="#fff3b0" opacity="0.9"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
